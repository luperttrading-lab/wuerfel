<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zahlen zerlegen</title>
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#24508f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Würfel">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root {
  /* Grund: helles Tiefblau mit Licht in der Mitte – der weiße Würfel hebt sich deutlich ab (vorher Creme, Kontrast 1,1 : 1) */
  --bg: #2b5a98; --grund: radial-gradient(120% 90% at 50% 42%, #4d88d2, #24508f);
  --ink: #2b2140;       /* dunkle Schrift auf hellen Flächen (Würfel, Tasten) */
  --hell: #f5f8ff; --leise: #c9d8f2;   /* Schrift direkt auf dem blauen Grund */
  --teil-hell: #b5d8ff; --ganz-hell: #ddd2ff; --rest-hell: #ffbf5e;   /* Zahlfarben auf dem Grund */
  --karte: #fff; --sockel: rgba(8, 24, 56, .35);
  --teil: #2f6bd0;      /* gewürfelte Zahl */
  --rest: #e8780c;      /* gesuchte Zahl */
  --ganz: #6c4bd8;      /* Zahl, die zerlegt wird */
  --richtig: #2fbf55; --gut: #2f9e5b; --falsch: #c94848;   /* kräftig genug für helle Schrift */
  --wahl: #efe7ff;
  --rand: 16px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { touch-action: manipulation; -webkit-text-size-adjust: 100%; }
/* Eine feste Bildschirmseite: nichts lässt sich schieben, nichts federt (iPhone-„Gummiband“) */
html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
body {
  position: fixed; inset: 0;
  margin: 0; background: var(--bg) var(--grund) fixed; color: var(--hell);
  font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  transition: background-color .25s ease;
}
body.gut { background: var(--gut); }
body.falsch { background: var(--falsch); }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }

.seite {
  max-width: 640px; margin: 0 auto; height: 100%; overflow: hidden;
  display: flex; flex-direction: column; gap: 14px;
  padding: max(env(safe-area-inset-top), 12px) max(env(safe-area-inset-right), var(--rand))
           max(env(safe-area-inset-bottom), 16px) max(env(safe-area-inset-left), var(--rand));
}

/* Kopf */
.kopf { display: flex; align-items: center; gap: 10px; min-height: 44px; }
.kopf h1 { margin: 0; flex: 1; min-width: 0; font-size: 22px; font-weight: 800; display: flex; align-items: baseline; gap: 8px; }
.version {
  font-size: 13px; font-weight: 600; color: var(--leise); padding: 6px 2px;
  text-decoration: underline dotted; text-underline-offset: 3px;
}
.stand { font-size: 14px; font-weight: 700; color: var(--leise); white-space: nowrap; }
.ton, .zurueck, .tiere-schalter, .staub-schalter { width: 44px; height: 44px; flex: none; border-radius: 12px; background: var(--wahl); font-size: 22px; }
.tiere-schalter[aria-pressed="false"], .staub-schalter[aria-pressed="false"] { filter: grayscale(1); opacity: .45; }
.staub-schalter[aria-pressed="true"] {   /* bunter Staub */
  background: linear-gradient(135deg, #ff6fae, #ffb347 28%, #ffe45c 46%, #5fe0a0 64%, #5ab8ff 82%, #a77bff);
  box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .55); }
.tiere-schalter[data-satz="wild"] {   /* wilde, bunte Tiere: kräftiger Regenbogen wie ihre Farbspritzer */
  background: linear-gradient(135deg, #ff6fae, #ffb347 28%, #ffe45c 46%, #5fe0a0 64%, #5ab8ff 82%, #a77bff);
  box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .55); }

/* Tiere: jede Zahl hat ihr Tier (Vogel 4 … Zebra 10) – Anker „wir sind bei der 7, beim Seestern“.
   Zwei Sätze: Sticker (tiere/) und wild & bunt (tiere/wild/), Schalter 🐾 auf der Startseite. */
/* Das Tier nimmt den freien Platz über dem Würfel: so groß, wie die Seite hergibt, höchstens 62 % der Breite
   bzw. 280 px hoch. Auf dem kleinen iPhone wird es kleiner, statt etwas aus dem Bild zu schieben.
   Das Feld hat das Seitenverhältnis des Tiers (--seiten, vom Skript): breite Tiere werden breit, nicht klein.
   Unten ragt es 12 px in die Luft über dem ruhenden Würfel (die braucht er nur beim Rollen). */
.tier { position: relative; flex: 1 1 0; width: 100%; min-height: 70px; max-height: min(62vw, 280px); margin-bottom: -12px;
  display: flex; justify-content: center; }
.tier-platte { position: relative; height: 100%; aspect-ratio: var(--seiten, 1); container-type: size;
  max-width: calc(100vw - 150px); }            /* rechts bleibt Platz für die Zahlplakette */
.tier img { width: 100%; height: 100%; object-fit: contain; display: block; filter: drop-shadow(0 4px 8px rgba(43, 33, 64, .22)); }
.tier-zahl {
  /* wächst mit dem Tier (24 % des Bildes) und steht rechts unten daneben – die Sticker haben freie Formen,
     so verdeckt sie nie ein Bein, einen Arm oder einen Punkt (Test prüft das Pixel für Pixel) */
  position: absolute; left: 100%; top: 70%; min-width: 24%; height: 24%; padding: 0 .3em; border-radius: 999px;
  display: grid; place-items: center; background: var(--ganz); color: #fff; font-size: 21px; font-size: 13cqh; font-weight: 900;
  border: 3px solid #fff; box-shadow: 0 2px 6px rgba(43, 33, 64, .2);
}
.tier.hops { animation: tierHops .7s ease; }
.tier.tanzt { animation: tierHops .7s ease 2; }
@keyframes tierHops {
  0%, 100% { transform: none; } 25% { transform: translateY(-16px) scale(1.08) rotate(-6deg); }
  50% { transform: none; } 75% { transform: translateY(-7px) rotate(5deg); }
}
/* „Sagen“ (Standard): nur würfeln und die fehlende Zahl laut sagen – ohne Zahlenleiste und Gleichung.
   Die Fassung zum Antippen bleibt in der Hinterhand: Adresse mit ?tippen */
.sagen .zahlen, .sagen .lupe, .sagen .gleichung, .sagen .hinweis, .sagen .stand { display: none; }   /* nur der Würfel */
.sagen .sockel { --s: clamp(140px, 44vw, 240px); }
.zahlwahl img { display: none; }
.mit-tieren .zahlwahl button { height: auto; padding: 6px 0 8px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.mit-tieren .zahlwahl img { display: block; width: 86%; aspect-ratio: 1; object-fit: contain; }
.zurueck { font-size: 28px; font-weight: 800; color: var(--ganz); line-height: 1; }

/* Startseite */
.start { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding-bottom: 8vh; }
.start h2 { margin: 0; text-align: center; text-wrap: balance; font-size: clamp(26px, 7.5vw, 38px); font-weight: 900; }
.zahlwahl { display: flex; gap: 6px; width: 100%; max-width: 560px; }   /* eine Reihe: klein links, groß rechts */
.zahlwahl button {
  flex: 1 1 0; min-width: 0; height: clamp(64px, 18vw, 96px); border-radius: 16px; padding: 0;
  background: var(--karte); color: var(--ganz); border: 3px solid var(--ganz);
  font-size: clamp(26px, 8vw, 44px); font-weight: 900; letter-spacing: -.03em; box-shadow: 0 5px 0 var(--sockel);
}
.zahlwahl button:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--sockel); }
.zahlwahl button.zuletzt { background: var(--ganz); color: #fff; }
.erklaerung { margin: 0; max-width: 340px; text-align: center; font-size: 15px; line-height: 1.4; color: var(--leise); }

/* Spielseite */
.titel .ganz { color: var(--ganz-hell); }
.buehne { position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
.sockel { position: relative; --s: clamp(130px, 38vw, 210px); }   /* --s: Kantenlänge des Würfels */
.sockel::after {          /* Schatten bleibt liegen, während der Würfel sich überschlägt */
  content: ""; position: absolute; left: 22%; right: 22%; bottom: 2%; height: 16px;
  border-radius: 50%; background: rgba(6, 18, 44, .45); filter: blur(5px);
  transform: scale(calc(1 - var(--sprung, 0) * .45)); opacity: calc(1 - var(--sprung, 0) * .6);   /* in der Luft kleiner */
}
.wuerfel {                /* echter Würfel in 3D */
  position: relative; z-index: 1; width: calc(var(--s) * 1.5); height: calc(var(--s) * 1.45);
  display: grid; place-items: center; perspective: calc(var(--s) * 6);
}
.staub {                  /* Staub beim Wirbeln, gezeichnet vom Skript */
  position: absolute; left: 50%; top: 50%; z-index: 0; pointer-events: none;   /* hinter dem Würfel */
  width: min(calc(var(--s) * 2.6), calc(100vw - 8px)); height: calc(var(--s) * 2.4);
  transform: translate(-50%, -50%);
}
.koerper {
  position: relative; width: var(--s); height: var(--s);
  transform-style: preserve-3d; transform: rotateX(-10deg) rotateY(-12deg); will-change: transform;
}
/* Würfel aus 26 Teilen: 6 Flächen, 12 schräge Kantenstreifen, 8 Eckdreiecke. Größe und Lage
   rechnet das Skript (baueKoerper); die Kantenstreifen bekommen einen Verlauf, der sie rund wirken lässt. */
.flaeche, .kante, .ecke {
  position: absolute; left: 50%; top: 50%;
  -webkit-backface-visibility: hidden; backface-visibility: hidden;
}
.flaeche { display: grid; place-items: center; background: radial-gradient(circle at 35% 30%, #fff 0%, #fcfaff 60%, #f5f0fc 100%); }
.kante, .ecke { background: #f5f0fc; }
.flaeche::after, .kante::after { content: ""; position: absolute; inset: 0; pointer-events: none; }
.flaeche::after { background: rgba(43, 33, 64, var(--m, 0)); }          /* Licht je nach Lage */
.kante::after {
  background: linear-gradient(to bottom, rgba(43, 33, 64, var(--o, 0)), rgba(43, 33, 64, var(--m, 0)), rgba(43, 33, 64, var(--u, 0)));
}
.flaeche span {
  position: relative; z-index: 1;
  text-shadow: 0 .025em 0 rgba(255, 255, 255, .75), 0 -.02em 0 rgba(43, 33, 64, .22);   /* wirkt eingeprägt */
  font-size: calc(var(--s) * .56); font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums;
  color: #c9bfdb; transition: color .25s ease;
}
.koerper, .koerper * { pointer-events: none; }  /* Tipps gehen an den Knopf, gedrehte Flächen liegen nie im Weg */
.wuerfel.rollt .flaeche span { color: var(--ink); }
.wuerfel.ganz .vorne span { color: var(--ganz); }
.wuerfel.gelandet .vorne span { color: var(--teil); }
.wuerfel.stups { animation: wackeln .4s ease; }

.gleichung {
  --rahmen: .14em;        /* so weit steht der Lückenkasten über die Ziffer hinaus */
  margin: 2px 0 0; display: flex; align-items: center; gap: .34em; line-height: 1.15;
  font-size: clamp(38px, 11vw, 58px); font-weight: 900; font-variant-numeric: tabular-nums;
}
.gleichung .teil, .gleichung .luecke, .gleichung .rest, .gleichung .ganz { min-width: 1ch; text-align: center; }
.gleichung .teil { color: var(--teil-hell); }
.gleichung .rest { color: var(--rest-hell); animation: pop .35s ease both; }
.gleichung .ganz { color: var(--ganz-hell); }
/* Der Kasten ist nur gezeichnet und nimmt keinen Platz; der Außenabstand gleicht seinen Überstand aus.
   So ist der Abstand zum Kasten gleich dem Abstand zwischen den Ziffern – in Frage und Lösung. */
.gleichung .luecke { position: relative; margin: 0 var(--rahmen); color: var(--rest-hell); }
.gleichung .luecke::before {
  content: ""; position: absolute; inset: -.04em calc(-1 * var(--rahmen));
  border: .06em dashed var(--rest-hell); border-radius: .18em;
}
.gleichung.weg { visibility: hidden; }          /* Platz bleibt, nichts springt */
.hinweis { margin: 0; min-height: 1.3em; text-align: center; font-size: clamp(18px, 5vw, 24px); font-weight: 800; }
.hinweis.lockt { animation: locken 1.8s ease-in-out infinite; }   /* leiser Hinweis: Schwarz ↔ Lila (Würfelzahl) */
@keyframes locken { 0%, 100% { color: var(--hell); } 50% { color: var(--ganz-hell); } }

.zahlen {                /* eine Leiste wie ein Zahlenstrahl: klein links, groß rechts, kein Zeilensprung */
  display: flex; gap: 3px; touch-action: none; margin: 0 calc(8px - var(--rand));
}
/* Antworttasten: immer kräftiges Bernstein mit dunkler Schrift (Kontrast ≈ 8,6 : 1), Farbfamilie der orangen
   Lücke – in jedem Zustand gleich, damit man immer sieht, wo das Arbeitsmaterial ist. */
.zahl {
  flex: 1 1 0; min-width: 0; padding: 0;
  height: clamp(64px, 18vw, 88px); border-radius: 12px; color: var(--ink);
  background-color: #ffb547; background-image: linear-gradient(#ffcb6e, #ffb03b);
  font-size: clamp(18px, calc(min(100vw, 640px) / var(--anzahl, 11) * .62), 42px); font-weight: 900; letter-spacing: -.05em;
  box-shadow: 0 5px 0 #d98a12, 0 8px 14px rgba(160, 90, 0, .18);
  transition: transform .08s ease, background-color .2s ease, color .2s ease;
}
.zahl.gedrueckt { transform: translateY(3px); box-shadow: 0 2px 0 #d98a12; }
.lupe {                   /* wie bei der iPhone-Tastatur: die getroffene Zahl groß über dem Finger */
  position: fixed; z-index: 26; pointer-events: none; width: 68px; height: 76px; margin-left: -34px;
  display: grid; place-items: center; border-radius: 18px;
  background: linear-gradient(#ffd27a, #ffb547); color: var(--ink); font-size: 48px; font-weight: 900;
  box-shadow: 0 8px 22px rgba(43, 33, 64, .28);
}
.zahl.richtig { color: #fff; background-color: var(--richtig); background-image: none; box-shadow: 0 5px 0 #1f8a3c; }
.zahl.wackelt { animation: wackeln .4s ease; }

@keyframes wackeln {
  0%, 100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); }
  60% { transform: translateX(-6px); } 80% { transform: translateX(6px); }
}
@keyframes pop { 0% { transform: scale(.3); opacity: 0; } 70% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition: none !important; }
  /* Farbwechsel ist keine Bewegung: der Hinweis „Tippe auf den Würfel!“ darf weiter leuchten */
  .hinweis.lockt { animation-duration: 1.8s !important; animation-iteration-count: infinite !important; }
}

.funken { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 25; }   /* Sterne */

/* Update-Banner (Mechanik siehe Skill app-update-iphone) */
.update {
  position: fixed; left: 12px; right: 12px; top: max(env(safe-area-inset-top), 12px); z-index: 30;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  background: #34c759; color: #06240e;
  padding: 12px 14px; border-radius: 14px; font-weight: 600; box-shadow: 0 8px 24px rgba(0, 0, 0, .25);
  opacity: 0; transition: opacity .35s ease; pointer-events: none;
}
.update.an { opacity: 1; pointer-events: auto; }
.update[hidden] { display: none; }
.update.info {        /* kurzer Hinweis: kleine Pille mittig unter der Kopfzeile, verdeckt keine Knöpfe */
  left: 50%; right: auto; transform: translateX(-50%); width: max-content; max-width: calc(100% - 32px);
  top: calc(max(env(safe-area-inset-top), 12px) + 56px); padding: 7px 16px; border-radius: 999px;
  background: rgba(43, 33, 64, .86); color: #fff; font-size: 15px; font-weight: 700; box-shadow: 0 4px 14px rgba(43, 33, 64, .25); }
.update.info.an { pointer-events: none; }   /* nur Hinweis, kein Knopf: Tipps gehen durch (z. B. 🐾 mehrmals) */
.update.unten { top: auto; bottom: max(env(safe-area-inset-bottom), 12px); }
/* Statistik: 3 s auf „Zerlegen: 9“ (oder die runde Zahl am Tier) drücken – unten erscheint, welche Zahl wie oft vorn lag */
.titel, .tier-zahl { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.zaehler {              /* Teil der Seite (kein Overlay): eingeblendet rückt alles zusammen, der Würfel bleibt frei */
  flex: none; margin: 0 calc(8px - var(--rand)); padding: 8px 12px 10px; border-radius: 14px;
  background: rgba(10, 20, 45, .72); color: #fff; }
.zaehler-kopf { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; font-size: 14px; font-weight: 800; }
.zaehler-kopf small { font-size: 12px; font-weight: 600; color: var(--leise); white-space: nowrap; }
.zaehler-tafel { display: grid; grid-template-columns: 1fr 1fr; column-gap: 18px; row-gap: 1px;
  font: 600 13px/1.45 ui-monospace, Menlo, monospace; font-variant-numeric: tabular-nums; }
.zaehler-tafel span { display: flex; justify-content: space-between; gap: 6px; white-space: pre; }
.zaehler-tafel b { color: var(--rest-hell); }
.zaehler button { flex: none; padding: 5px 10px; border-radius: 9px; background: rgba(255, 255, 255, .16); color: #fff; font-size: 12px; font-weight: 700; }
.update .btn { padding: 8px 14px; border-radius: 10px; font-size: 15px; font-weight: 700; background: #06240e; color: #fff; }
</style>
</head>
<body>
<div class="update" id="update" hidden>
  <span id="update-text"></span>
  <button class="btn" id="update-go">Jetzt laden</button>
</div>

<canvas class="funken" id="funken" aria-hidden="true"></canvas>

<main class="seite" id="startseite">
  <header class="kopf">
    <h1>Würfel <span class="version" id="version"></span></h1>
    <button class="staub-schalter" id="staub-schalter" aria-label="Bunter Staub an oder aus" aria-pressed="true">💨</button>
    <button class="tiere-schalter" id="tiere-schalter" aria-label="Tiere an oder aus" aria-pressed="false">🐾</button>
    <button class="ton" aria-label="Ton an oder aus"></button>
  </header>
  <section class="start">
    <h2>Welche Zahl zerlegen wir?</h2>
    <div class="zahlwahl" id="zahlwahl"></div>
    <p class="erklaerung">Der Würfel zeigt eine Zahl. Tippe die Zahl an, die bis zur gewählten Zahl fehlt.</p>
  </section>
</main>

<main class="seite" id="spielseite" hidden>
  <header class="kopf">
    <button class="zurueck" id="zurueck" aria-label="Andere Zahl wählen">‹</button>
    <h1 class="titel">Zerlegen: <span class="ganz" id="titel-n"></span> <span class="stand" id="stand"></span></h1>
    <button class="ton" aria-label="Ton an oder aus"></button>
  </header>
  <section class="buehne">
    <div class="tier" id="tier" hidden><div class="tier-platte"><img id="tier-bild" alt=""><span class="tier-zahl" id="tier-zahl"></span></div></div>
    <div class="sockel">
      <canvas class="staub" id="staub" aria-hidden="true"></canvas>
      <button class="wuerfel" id="wuerfel" aria-label="Würfeln">
        <div class="koerper" id="koerper">
          <div class="flaeche vorne"><span id="augenzahl"></span></div>
          <div class="flaeche hinten"><span></span></div>
          <div class="flaeche rechts"><span></span></div>
          <div class="flaeche links"><span></span></div>
          <div class="flaeche oben"><span></span></div>
          <div class="flaeche unten"><span></span></div>
        </div>
      </button>
    </div>
    <p class="gleichung" id="gleichung" aria-live="polite"></p>
    <p class="hinweis" id="hinweis"></p>
  </section>
  <div class="zaehler" id="zaehler" hidden aria-live="polite">
    <div class="zaehler-kopf"><span><span id="zaehler-titel"></span> <small id="zaehler-soll"></small></span>
      <button type="button" id="zaehler-neu">Neu zählen</button></div>
    <div class="zaehler-tafel" id="zaehler-tafel"></div>
  </div>
  <section class="zahlen ruht" id="zahlen" aria-label="Antwort antippen"></section>
  <div class="lupe" id="lupe" hidden aria-hidden="true"></div>
</main>

<script>
const APP_VERSION = '0.41';          // bei JEDER Änderung hochzählen

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

/* ---------- Zustand ---------- */
const ZAHLEN = [4, 5, 6, 7, 8, 9, 10];
const TIERE = { 4: 'Vogel', 5: 'Frosch', 6: 'Seepferdchen', 7: 'Seestern', 8: 'Oktopus', 9: 'Nashorn', 10: 'Zebra' };
const SPEICHER = 'wuerfel.stand';
const SAGEN = !new URLSearchParams(location.search).has('tippen');   // Standard: Antwort laut sagen; ?tippen: Zahlenleiste
document.body.classList.toggle('sagen', SAGEN);
const ZAEHLEN = new URLSearchParams(location.search).has('zaehlen');   // Statistik gleich beim Spielstart zeigen
if (SAGEN) document.querySelector('.erklaerung').textContent = 'Tippe auf den Würfel. Sag laut, was bis zur gewählten Zahl fehlt – dann tippe wieder.';
const stand = { n: 10, ton: true, sterne: 0, tiere: 'aus', staub: true, statistik: {} };   // statistik[n]: wie oft lag 0 … n vorn   // staub: bunter Staub beim Würfeln (💨)   // Tiere zuerst aus; 🐾 schaltet: aus → Sticker → wild
const TIERSAETZE = { aus: 'Ohne Tiere', sticker: 'Tiere: Sticker', wild: 'Tiere: wild & bunt' };
const STAUB = 4;                    // Staubmenge (Faktor), am Gerät ausprobiert: Maximum
const STERNE = 60;                  // Sterne bei richtiger Antwort (nach einer ganzen Runde 2,2-mal so viele)
try {
  const s = JSON.parse(localStorage.getItem(SPEICHER)) || {};
  if (ZAHLEN.includes(s.n)) stand.n = s.n;
  if (s.ton === false) stand.ton = false;
  if (s.staub === false) stand.staub = false;
  if (Object.prototype.hasOwnProperty.call(TIERSAETZE, s.tiere)) stand.tiere = s.tiere;

  for (const k of kanten) {                               // Verlauf von einer Nachbarfläche zur anderen: wirkt rund
    k.el.style.setProperty('--m', schatten(k.n));
    k.el.style.setProperty('--o', flaechen[k.aUnten ? k.b : k.a]);
    k.el.style.setProperty('--u', flaechen[k.aUnten ? k.a : k.b]);
  }
  for (const e of ecken) if (e.flaechen) e.flaechen.forEach((k, i) => e.el.style.setProperty('--a' + i, flaechen[k]));
}
function beschrifte(k, z) { seiten[k].el.firstElementChild.textContent = z; }
function zeigeZiffer(z) { beschrifte('vorne', z); }
// Zahl für eine Nebenseite: nie die gewürfelte, nie die Lösung (sonst verrät der Würfel die Antwort),
// und möglichst keine, die auf einer anderen Seite schon steht.
function zufallsZahl(k, seite) {
  const gesperrt = new Set([k, stand.n - k]);
  const frei = [];
  for (let z = 0; z <= stand.n; z++) if (!gesperrt.has(z)) frei.push(z);
  const belegt = new Set(Object.keys(seiten).filter(x => x !== seite).map(x => +seiten[x].el.textContent));
  const besser = frei.filter(z => !belegt.has(z));
  const auswahl = besser.length ? besser : frei;
  return auswahl[zufall(auswahl.length)];
}
// Auf der Stelle: kleiner und wieder groß, dann Aufprall mit kurzem Stauchen (breiter und flacher)
function bewegung(p) {
  const weg = p < AUFPRALL ? Math.sin(Math.PI * p / AUFPRALL) : 0;            // 0 … 1 … 0
  let breit = 1, flach = 1;
  if (p >= AUFPRALL) {
    const q = (p - AUFPRALL) / (1 - AUFPRALL);                                // 0 … 1 nach dem Aufprall
    flach = q < 0.45 ? 1 - 0.09 * Math.sin(Math.PI * q / 0.45) : 1 + 0.025 * Math.sin(Math.PI * (q - 0.45) / 0.55);
    breit = 1 + (1 - flach) * 0.6;
  }
  return { weg, groesse: 1 - (1 - KLEINSTE) * weg, breit, flach };
}
function schritt(t) {
  // Animationszeit rückt pro Bild höchstens 40 ms vor: ruckelt das Gerät, rollt der Würfel einen Hauch
  // länger, statt Lagen zu überspringen – so wird das Fenster für die Vorderseite (142 ms) nie verpasst.
  lauf.zeit += Math.min(40, Math.max(0, t - (lauf.tLetzt ?? lauf.t0)));
  lauf.tLetzt = t;
  const p = Math.min(1, lauf.zeit / ROLLZEIT);
  const f = 1 - (1 - p) ** 2;                                       // gleichmäßig abbremsen
  const ax = RUHE.x + DREH.x * f, ay = RUHE.y + DREH.y * f, az = DREH.z * f;
  let vorn = null, best = -2;
  for (const k in seiten) {
    const s = seiten[k], z = drehe(NORMALE[k], ax, ay)[2];
    if (z > best) { best = z; vorn = k; }
    // Vorderseite: die gewürfelte Zahl kommt drauf, sobald sie im letzten Überschlag fast hochkant oder
    // dahinter steht (z < 0,15 – mehr als 81° weggedreht). Das Fenster ist 142 ms lang: auch bei
    // ruckelnder Darstellung (12 Bilder/s) wird es getroffen, die Zahl springt nie sichtbar um.
    if (k === 'vorne' && p > 0.4 && z < 0.15 && !lauf.gesetzt) { beschrifte(k, lauf.ziel); lauf.gesetzt = true; }
    if (z < -0.1) {                                                 // zeigt nach hinten: umschreiben
      if (!(k === 'vorne' && lauf.gesetzt) && !s.weg) beschrifte(k, zufallsZahl(lauf.ziel, k));
      s.weg = true;
    } else if (z > 0) s.weg = false;
  }
  if (vorn !== lauf.vorn) { lauf.vorn = vorn; klang.tick(); }       // klickt bei jedem Überschlag
  const { weg, groesse, breit, flach } = bewegung(p);
  if (p >= AUFPRALL && !lauf.aufgeschlagen) { lauf.aufgeschlagen = true; klang.landen(); staubWolke(); }
  if (p < 0.5) {                                                              // Staub, solange er schnell dreht
    lauf.staub += 640 * STAUB * (1 - p / 0.5) * Math.max(0, (t - (lauf.tz || t)) / 1000);   // so viel wie früher in 2 s
    while (lauf.staub >= 1) { lauf.staub--; streue(1, 1 - p / 0.5); }
  }
  lauf.tz = t;
  // Bewusst auch bei „Bewegung reduzieren“: Das Drehen ist hier der Kern des Spiels (Wunsch des Auftraggebers).
  stelle(ax, ay, az, groesse, breit, flach);
  sockelEl.style.setProperty('--sprung', weg.toFixed(3));                     // Schatten schrumpft mit
  if (p >= 1) { landen(); return; }
  rafId = requestAnimationFrame(schritt);
}
function bereit(text = 'Tippe auf den Würfel!') {                 // zeigt die ganze Zahl und wartet
  clearTimeout(weiterTimer);
  phase = 'bereit';
  zahl = null;
  delete wuerfelEl.dataset.zahl;
  zeigeZiffer(stand.n);
  wuerfelEl.classList.remove('gelandet');
  wuerfelEl.classList.add('ganz');
  wuerfelEl.setAttribute('aria-label', 'Würfeln');
  zahlenEl.classList.add('ruht');
  zahlenEl.querySelectorAll('.richtig').forEach(b => b.classList.remove('richtig'));
  hinweisEl.textContent = text;
  locke();
}
// Nach 2 s ohne Tipp beginnt „Tippe auf den Würfel!“ sanft die Farbe zu wechseln – bis gewürfelt wird
function locke() {
  clearTimeout(lockTimer);
  hinweisEl.classList.remove('lockt');
  lockTimer = setTimeout(() => { if (phase === 'bereit') hinweisEl.classList.add('lockt'); }, 2000);
}
function lockeNicht() { clearTimeout(lockTimer); hinweisEl.classList.remove('lockt'); }
function wuerfeln() {
  clearTimeout(weiterTimer);
  lockeNicht();
  lauf = { ziel: wurfZiel(), t0: performance.now(), zeit: 0, tLetzt: null, gesetzt: false, vorn: 'vorne', aufgeschlagen: false, staub: 0 };
  for (const k in seiten) seiten[k].weg = false;
  phase = 'rollt';
  zahl = null;
  audio();
  wuerfelEl.classList.remove('ganz', 'gelandet');
  wuerfelEl.classList.add('rollt');
  wuerfelEl.setAttribute('aria-label', 'Würfelt …');
  document.body.classList.remove('gut', 'falsch');
  zahlenEl.classList.add('ruht');
  zahlenEl.querySelectorAll('.richtig').forEach(b => b.classList.remove('richtig'));
  gleichungEl.classList.add('weg');
  hinweisEl.textContent = '';
  zeigeStand();
  klang.wusch();
  streue(staubMenge(20), 1);                                                  // erster Schwung beim Abwurf
  rafId = requestAnimationFrame(schritt);
}
function landen() {
  cancelAnimationFrame(rafId);
  zahl = lauf.ziel;
  if ($('#augenzahl').textContent !== String(zahl)) umgesprungen++;   // wurde die Zahl nicht verdeckt aufgemalt? (Test)
  zeigeZiffer(zahl);
  zaehle(+$('#augenzahl').textContent);                           // Statistik: gezählt wird, was vorn steht
  stelle(RUHE.x, RUHE.y);
  sockelEl.style.setProperty('--sprung', 0);
  wuerfelEl.classList.remove('rollt');
  wuerfelEl.classList.add('gelandet');
  wuerfelEl.dataset.zahl = zahl;
  wuerfelEl.setAttribute('aria-label', 'Gewürfelt: ' + zahl);
  phase = 'frage';
  zahlenEl.classList.remove('ruht');
  zeigeGleichung(zahl, null);
  gleichungEl.classList.remove('weg');
  hinweisEl.textContent = 'Welche Zahl fehlt?';
}
function stoppeWuerfel() {
  cancelAnimationFrame(rafId); clearTimeout(weiterTimer);
  wuerfelEl.classList.remove('rollt');
  stelle(RUHE.x, RUHE.y);
  sockelEl.style.setProperty('--sprung', 0);
}

/* ---------- Anzeige ---------- */
function zeigeGleichung(k, rest) {
  const a = `<span class="teil">${k}</span>`;
  const b = rest == null ? '<span class="luecke">?</span>' : `<span class="rest">${rest}</span>`;
  gleichungEl.innerHTML = `${a}<span>+</span>${b}<span>=</span><span class="ganz">${stand.n}</span>`;
}
const mitTieren = () => stand.tiere !== 'aus';
const tierBild = n => (stand.tiere === 'wild' ? 'tiere/wild/' : 'tiere/') + n + '.webp';
function zeigeTiere() {
  const knopf = $('#tiere-schalter');
  document.body.classList.toggle('mit-tieren', mitTieren());
  knopf.setAttribute('aria-pressed', String(mitTieren()));
  knopf.dataset.satz = stand.tiere;
  knopf.setAttribute('aria-label', TIERSAETZE[stand.tiere] + ' – antippen zum Wechseln');
  $('#tier').hidden = !mitTieren();
  if (mitTieren()) $$('#zahlwahl button').forEach(b => { b.querySelector('img').src = tierBild(b.dataset.n); });
}
function zeigeTon() { $$('.ton').forEach(b => { b.textContent = stand.ton ? '🔊' : '🔇'; }); }
function zeigeStand() { $('#stand').textContent = geschafft + '/' + (stand.n + 1); }
function nochmal(el, klasse) { el.classList.remove(klasse); void el.offsetWidth; el.classList.add(klasse); }
let farbTimer = null;
function faerbe(klasse, ms) {
  clearTimeout(farbTimer);
  document.body.classList.remove('gut', 'falsch');
  void document.body.offsetWidth;
  document.body.classList.add(klasse);
  farbTimer = setTimeout(() => document.body.classList.remove(klasse), ms);
}

function baueZahlen() {
  zahlenEl.textContent = '';
  zahlenEl.style.setProperty('--anzahl', stand.n + 1);
  for (let k = 0; k <= stand.n; k++) {
    const b = document.createElement('button');
    b.className = 'zahl';
    b.dataset.zahl = k;
    b.textContent = k;
    zahlenEl.append(b);
  }
}

/* ---------- Ablauf ---------- */
function zeigeStart() {
  stoppeWuerfel();
  lockeNicht();
  phase = 'start';
  document.body.classList.remove('gut', 'falsch');
  $$('#zahlwahl button').forEach(b => b.classList.toggle('zuletzt', +b.dataset.n === stand.n));
  spielEl.hidden = true;
  startEl.hidden = false;
}
// Statistik: wie oft lag jede Zahl vorn – je gewählter Zahl gespeichert, auch über Tage
let umgesprungen = 0;
function zaehle(k) {
  const a = stand.statistik[stand.n] ||= Array(stand.n + 1).fill(0);
  a[k]++;
  speichereAlles();
  if (!$('#zaehler').hidden) zeigeZaehler();
}
function zeigeZaehler() {
  const n = stand.n, a = stand.statistik[n] || Array(n + 1).fill(0), summe = a.reduce((x, y) => x + y, 0);
  const prozent = x => summe ? (100 * x / summe).toLocaleString('de-DE', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' %' : '–';
  $('#zaehler-titel').textContent = `Statistik bei ${n}: ${summe} ${summe === 1 ? 'Wurf' : 'Würfe'}`;
  $('#zaehler-soll').textContent = `· Soll je ${(100 / (n + 1)).toLocaleString('de-DE', { maximumFractionDigits: 1 })} %`;
  // zwei Spalten, von oben nach unten gelesen: links 0 … Mitte, rechts der Rest
  const halb = Math.ceil((n + 1) / 2), zellen = [];
  for (let r = 0; r < halb; r++) for (const k of [r, r + halb]) {
    zellen.push(k <= n ? `<span><b>${String(k).padStart(2)}</b>${String(a[k]).padStart(5)}  ${prozent(a[k]).padStart(6)}</span>` : '<span></span>');
  }
  $('#zaehler-tafel').innerHTML = zellen.join('');
}
function schalteZaehler(an = $('#zaehler').hidden) {
  $('#zaehler').hidden = !an;
  if (an) zeigeZaehler();
}
function starteSpiel(n) {
  stand.n = n;
  speichereAlles();
  if (ZAEHLEN) schalteZaehler(true);
  audio();                                       // iOS: Ton im Rahmen eines Tipps freischalten
  $('#titel-n').textContent = n;
  if (mitTieren()) $('#tier-bild').src = tierBild(n);
  $('#tier-bild').alt = TIERE[n];
  $('#tier-zahl').textContent = n;
  zeigeTiere();
  baueZahlen();
  beutel = neuerBeutel(n, null);
  geschafft = 0;
  zeigeStand();
  startEl.hidden = true;
  spielEl.hidden = false;
  baueKoerper();
  staubLeinwand();
  stelle(RUHE.x, RUHE.y);
  zeigeGleichung(0, null);                        // unsichtbar, hält aber ihren Platz – nichts springt
  for (const k in seiten) if (k !== 'vorne') beschrifte(k, zufallsZahl(n, k));
  gleichungEl.classList.add('weg');               // vor der ersten Aufgabe keine Gleichung
  bereit();
}

function tippeWuerfel() {
  if (phase === 'bereit' || phase === 'geloest') wuerfeln();
  else if (phase === 'frage' && SAGEN) wuerfeln();             // „Sagen“: Antwort war laut, weiter würfeln
  else if (phase === 'frage') { nochmal(wuerfelEl, 'stups'); hinweisEl.textContent = 'Tippe unten die Zahl an!'; }
}

function antwort(k, btn) {
  if (phase !== 'frage') {                                                  // vor dem Würfeln: Hinweis statt Wertung
    if (phase === 'bereit') { nochmal(wuerfelEl, 'stups'); hinweisEl.textContent = 'Erst würfeln! Tippe auf den Würfel.'; }
    return;
  }
  if (k !== stand.n - zahl) {
    faerbe('falsch', 900);
    klang.falsch();
    nochmal(btn, 'wackelt');
    hinweisEl.textContent = 'Probier es nochmal!';
    return;
  }
  phase = 'geloest';
  stand.sterne++;                   // zählt still mit, wird nicht angezeigt: Üben ohne Punktestand und Druck
  speichereAlles();
  geschafft++;
  zeigeStand();
  btn.classList.add('richtig');
  zahlenEl.classList.add('ruht');
  zeigeGleichung(zahl, k);
  const rundeFertig = !beutel.length;
  faerbe('gut', rundeFertig ? 2600 : 1600);
  sterneAus(gleichungEl.querySelector('.rest'), Math.round(STERNE * (rundeFertig ? 2.2 : 1)));
  if (rundeFertig) {
    klang.runde();
    if (mitTieren()) nochmal($('#tier'), 'tanzt');
    hinweisEl.textContent = 'Alle Zerlegungen der ' + stand.n + ' geschafft!';
    beutel = neuerBeutel(stand.n, zahl);
    geschafft = 0;
  } else {
    klang.richtig();
    if (mitTieren()) nochmal($('#tier'), 'hops');
    hinweisEl.textContent = LOB[zufall(LOB.length)];
  }
  // Danach zeigt der Würfel wieder die ganze Zahl; die gelöste Gleichung bleibt zum Einprägen stehen.
  weiterTimer = setTimeout(() => {
    if (phase === 'geloest') bereit(rundeFertig ? 'Neue Runde: Tippe auf den Würfel!' : undefined);
  }, rundeFertig ? 3000 : 1800);
}

/* ---------- Verdrahtung ---------- */
// Ältere iPhones und eingebettete Browser federn trotz CSS: dort jedes Wischen abfangen.
// Regler und Knöpfe arbeiten mit Pointer-Ereignissen und bleiben davon unberührt.
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
for (const n of ZAHLEN) {
  const b = document.createElement('button');
  b.dataset.n = n;
  b.innerHTML = `<img alt=""><span>${n}</span>`;
  b.setAttribute('aria-label', `${n} – ${TIERE[n]}`);
  b.addEventListener('click', () => starteSpiel(n));
  $('#zahlwahl').append(b);
}
wuerfelEl.addEventListener('click', tippeWuerfel);
$('#tier-bild').addEventListener('load', e => {                // Feld bekommt die Form des Tiers
  e.target.parentElement.style.setProperty('--seiten', (e.target.naturalWidth / e.target.naturalHeight).toFixed(3));
});
// Zahlenleiste: Finger aufsetzen, notfalls seitlich rutschen – es zählt die Taste beim Loslassen.
const lupeEl = $('#lupe');
let gedrueckt = null;
function tasteBei(x) {                                                       // nächste Taste zur Fingerposition
  let beste = null, abstand = Infinity;
  for (const t of zahlenEl.children) {
    const r = t.getBoundingClientRect(), d = Math.abs(x - (r.left + r.width / 2));
    if (d < abstand) { abstand = d; beste = t; }
  }
  return beste;
}
function druecke(t) {
  if (gedrueckt === t) return;
  gedrueckt?.classList.remove('gedrueckt');
  gedrueckt = t;
  if (!t) { lupeEl.hidden = true; return; }
  t.classList.add('gedrueckt');
  if (phase !== 'frage') return;
  const r = t.getBoundingClientRect();
  lupeEl.textContent = t.dataset.zahl;
  lupeEl.style.left = Math.min(innerWidth - 38, Math.max(38, r.left + r.width / 2)) + 'px';
  lupeEl.style.top = (r.top - 86) + 'px';
  lupeEl.hidden = false;
}
zahlenEl.addEventListener('pointerdown', e => { zahlenEl.setPointerCapture(e.pointerId); druecke(tasteBei(e.clientX)); });
zahlenEl.addEventListener('pointermove', e => { if (zahlenEl.hasPointerCapture(e.pointerId)) druecke(tasteBei(e.clientX)); });
zahlenEl.addEventListener('pointerup', () => { const t = gedrueckt; druecke(null); if (t) antwort(+t.dataset.zahl, t); });
zahlenEl.addEventListener('pointercancel', () => druecke(null));
zahlenEl.addEventListener('click', e => {                                    // nur Tastatur (Enter/Leertaste)
  const b = e.target.closest('.zahl');
  if (b && e.detail === 0) antwort(+b.dataset.zahl, b);
});
$('#zurueck').addEventListener('click', () => { schalteZaehler(false); zeigeStart(); });
// 3 s gedrückt halten (auf „Zerlegen: 9“ oder die runde Zahl am Tier): Statistik ein- und ausblenden
for (const el of [$('#spielseite .titel'), $('#tier-zahl')]) {
  let halte = null;
  el.addEventListener('pointerdown', () => {
    clearTimeout(halte);
    halte = setTimeout(() => { schalteZaehler(); showInfo($('#zaehler').hidden ? 'Statistik aus' : 'Statistik an', 1.6); }, 3000);
  });
  for (const ende of ['pointerup', 'pointercancel', 'pointerleave']) el.addEventListener(ende, () => clearTimeout(halte));
  el.addEventListener('contextmenu', e => e.preventDefault());
}
$('#zaehler-neu').addEventListener('click', () => { stand.statistik[stand.n] = Array(stand.n + 1).fill(0); speichereAlles(); zeigeZaehler(); });
$('#tiere-schalter').addEventListener('click', e => {
  const reihe = Object.keys(TIERSAETZE);
  stand.tiere = reihe[(reihe.indexOf(stand.tiere) + 1) % reihe.length];
  speichereAlles(); zeigeTiere();
  showInfo(TIERSAETZE[stand.tiere], 1.6, e.currentTarget);
});
function zeigeStaub() { $('#staub-schalter').setAttribute('aria-pressed', String(stand.staub)); }
$('#staub-schalter').addEventListener('click', e => {
  stand.staub = !stand.staub; speichereAlles(); zeigeStaub();
  showInfo(stand.staub ? 'Bunter Staub an' : 'Ohne Staub', 1.6, e.currentTarget);
});
$$('.ton').forEach(b => b.addEventListener('click', () => {
  stand.ton = !stand.ton; speichereAlles(); zeigeTon();
  if (stand.ton) ton(783.99, 0, 0.15);
}));

$('#version').textContent = 'v' + APP_VERSION;
stelle(RUHE.x, RUHE.y);
zeigeTon();
zeigeTiere();
zeigeStaub();
zeigeStart();

/* ---------- Updates (Bausteine 0–4, Skill app-update-iphone) ---------- */
const updateEl = $('#update');
let infoTimer = null, ausTimer = null;
function einblenden() {
  clearTimeout(ausTimer);
  updateEl.hidden = false; void updateEl.offsetWidth;
  updateEl.classList.add('an');
}
function ausblenden() {
  updateEl.classList.remove('an'); clearTimeout(ausTimer);
  ausTimer = setTimeout(() => { if (!updateEl.classList.contains('an')) updateEl.hidden = true; }, 380);
}
function bannerAnKante(ausloeser) {
  if (!ausloeser) { updateEl.classList.remove('unten'); return; }
  const r = ausloeser.getBoundingClientRect();
  updateEl.classList.toggle('unten', r.top + r.height / 2 > window.innerHeight / 2);
}
function showInfo(text, sekunden = 2, ausloeser = null) {
  bannerAnKante(ausloeser);
  updateEl.className = 'update info';
  $('#update-text').textContent = text;
  $('#update-go').hidden = true;
  einblenden();
  clearTimeout(infoTimer);
  if (sekunden) infoTimer = setTimeout(() => { if (updateEl.classList.contains('info')) ausblenden(); }, sekunden * 1000);
}
function zeigeBanner(text) {
  bannerAnKante(null);
  updateEl.className = 'update';
  $('#update-text').textContent = text;
  $('#update-go').hidden = false;
  einblenden();
}
updateEl.addEventListener('click', () => { if (updateEl.classList.contains('info')) ausblenden(); });
$('#update-go').addEventListener('click', () => { speichereAlles(); location.reload(); });

let checking = false, announced = null;
async function checkForUpdate(manual = false) {
  if (checking) return;
  if (!manual && document.visibilityState !== 'visible') return;
  const ausloeser = manual ? $('#version') : null;
  if (!navigator.onLine) { if (manual) showInfo('Offline – Prüfung nicht möglich', 2, ausloeser); return; }
  checking = true;
  try {
    const res = await fetch('index.html', { cache: 'no-store' });
    if (!res.ok) return;
    const m = (await res.text()).match(/APP_VERSION = '([^']+)'/);
    if (m && m[1] !== APP_VERSION) announceUpdate(m[1], manual);
    else if (manual) showInfo('Version ' + APP_VERSION + ' ist aktuell', 4, ausloeser);
  } catch (_) { if (manual) showInfo('Prüfung fehlgeschlagen', 2, ausloeser); }
  finally { checking = false; }
}
function announceUpdate(v, manual) {
  if (announced === v && !manual) return;
  announced = v;
  speichereAlles();
  zeigeBanner('Neue Version ' + v + ' ist da');
  setTimeout(() => location.reload(), manual ? 1500 : 3000);   // kein Textfeld – Neuladen stört nichts
}
window.addEventListener('pageshow', () => setTimeout(checkForUpdate, 800));
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkForUpdate(); });
$('#version').addEventListener('click', () => checkForUpdate(true));

{
  const GESEHEN = 'wuerfel.gesehen';
  let vorher = null;
  try { vorher = localStorage.getItem(GESEHEN); } catch (_) {}
  if (vorher !== APP_VERSION) {
    try { localStorage.setItem(GESEHEN, APP_VERSION); } catch (_) {}
    if (vorher) setTimeout(() => showInfo('Version ' + APP_VERSION + ' ist geladen', 4), 400);
  }
}

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

// Für die Tests in tests/spiel.mjs
window.wuerfelSpiel = {
  zufall, neuerBeutel, wurfZiel, stand, starteSpiel,
  get zahl() { return zahl; }, get phase() { return phase; }, get beutel() { return beutel.slice(); },
  get staub() { return koerner.length; }, bewegung, ROLLZEIT, AUFPRALL, get umgesprungen() { return umgesprungen; },
  get sterne() { return funken.length; },
  get seiten() { return Object.fromEntries(Object.keys(seiten).map(k => [k, seiten[k].el.textContent])); },
};
