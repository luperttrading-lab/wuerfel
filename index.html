<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zahlen zerlegen</title>
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#fff8ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Würfel">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root {
  --bg: #fff8ec; --ink: #2b2140; --leise: #7a6f8f; --karte: #fff; --sockel: #eadfce;
  --teil: #2f6bd0;      /* gewürfelte Zahl */
  --rest: #e8780c;      /* gesuchte Zahl */
  --ganz: #6c4bd8;      /* Zahl, die zerlegt wird */
  --richtig: #2fbf55; --gut: #9be7a8; --falsch: #ff9d9d;
  --wahl: #efe7ff;
  --rand: 16px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { touch-action: manipulation; -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; min-height: 100dvh; background: var(--bg); color: var(--ink);
  font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  transition: background-color .25s ease;
}
body.gut { background: var(--gut); }
body.falsch { background: var(--falsch); }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }

.seite {
  max-width: 640px; margin: 0 auto; min-height: 100vh; min-height: 100dvh;
  display: flex; flex-direction: column; gap: 14px;
  padding: max(env(safe-area-inset-top), 12px) max(env(safe-area-inset-right), var(--rand))
           max(env(safe-area-inset-bottom), 16px) max(env(safe-area-inset-left), var(--rand));
}

/* Kopf */
.kopf { display: flex; align-items: center; gap: 10px; min-height: 44px; }
.kopf h1 { margin: 0; flex: 1; min-width: 0; font-size: 22px; font-weight: 800; display: flex; align-items: baseline; gap: 8px; }
.version {
  font-size: 13px; font-weight: 600; color: var(--leise); padding: 6px 2px;
  text-decoration: underline dotted; text-underline-offset: 3px;
}
.stand { font-size: 14px; font-weight: 700; color: var(--leise); white-space: nowrap; }
.sterne { font-size: 20px; font-weight: 800; white-space: nowrap; }
.sterne.hops { animation: hops .5s ease; }
.ton, .zurueck { width: 44px; height: 44px; flex: none; border-radius: 12px; background: var(--wahl); font-size: 22px; }
.zurueck { font-size: 28px; font-weight: 800; color: var(--ganz); line-height: 1; }

/* Startseite */
.start { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding-bottom: 8vh; }
.start h2 { margin: 0; text-align: center; text-wrap: balance; font-size: clamp(26px, 7.5vw, 38px); font-weight: 900; }
.zahlwahl { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; max-width: 460px; }
.zahlwahl button {
  width: clamp(66px, 19vw, 96px); aspect-ratio: 1; border-radius: 24px;
  background: var(--karte); color: var(--ganz); border: 4px solid var(--ganz);
  font-size: clamp(34px, 10vw, 48px); font-weight: 900; box-shadow: 0 5px 0 var(--sockel);
}
.zahlwahl button:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--sockel); }
.zahlwahl button.zuletzt { background: var(--ganz); color: #fff; }
.erklaerung { margin: 0; max-width: 340px; text-align: center; font-size: 15px; line-height: 1.4; color: var(--leise); }

/* Spielseite */
.titel .ganz { color: var(--ganz); }
.buehne { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
.sockel { position: relative; }
.sockel::after {          /* Schatten bleibt liegen, während der Würfel sich überschlägt */
  content: ""; position: absolute; left: 22%; right: 22%; bottom: 2%; height: 16px;
  border-radius: 50%; background: rgba(43, 33, 64, .18); filter: blur(5px);
}
.wuerfel {                /* echter Würfel in 3D: --s ist die Kantenlänge */
  --s: clamp(124px, 34vw, 190px);
  position: relative; z-index: 1; width: calc(var(--s) * 1.5); height: calc(var(--s) * 1.45);
  display: grid; place-items: center; perspective: calc(var(--s) * 6);
}
.koerper {
  position: relative; width: var(--s); height: var(--s);
  transform-style: preserve-3d; transform: rotateX(-20deg) rotateY(-25deg); will-change: transform;
}
.flaeche, .kern { position: absolute; inset: 0; }
.flaeche {
  display: grid; place-items: center; border-radius: 17%;
  background: radial-gradient(circle at 35% 30%, #fff 0%, #fcfaff 55%, #f0e9fa 100%);
  box-shadow: inset 0 0 0 1px rgba(108, 75, 216, .10), inset 0 0 calc(var(--s) * .09) rgba(108, 75, 216, .14);
  -webkit-backface-visibility: hidden; backface-visibility: hidden;
}
.flaeche::after {         /* Licht und Schatten je nach Lage der Seite, aus dem Skript gesetzt */
  content: ""; position: absolute; inset: 0; border-radius: inherit;
  background: var(--ink); opacity: var(--schatten, 0); pointer-events: none;
}
.flaeche span {
  font-size: calc(var(--s) * .56); font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums;
  color: #c9bfdb; transition: color .25s ease;
}
.vorne  { transform: translateZ(calc(var(--s) / 2)); }
.hinten { transform: rotateY(180deg) translateZ(calc(var(--s) / 2)); }
.rechts { transform: rotateY(90deg) translateZ(calc(var(--s) / 2)); }
.links  { transform: rotateY(-90deg) translateZ(calc(var(--s) / 2)); }
.oben   { transform: rotateX(90deg) translateZ(calc(var(--s) / 2)); }
.unten  { transform: rotateX(-90deg) translateZ(calc(var(--s) / 2)); }
.kern { inset: 3%; background: #ddd3ee; border-radius: 6%; }  /* füllt die Ecken; 3 % innen, sonst flackern ihre Kanten durch die Flächen */
.koerper, .koerper * { pointer-events: none; }  /* Tipps gehen an den Knopf, gedrehte Flächen liegen nie im Weg */
.kern.kx { transform: rotateY(90deg); }
.kern.ky { transform: rotateX(90deg); }
.wuerfel.rollt .flaeche span { color: var(--ink); }
.wuerfel.ganz .vorne span { color: var(--ganz); }
.wuerfel.gelandet .vorne span { color: var(--teil); }
.wuerfel.landet { animation: landen .35s ease; }
.wuerfel.stups { animation: wackeln .4s ease; }

.gleichung {
  margin: 8px 0 0; display: flex; align-items: center; gap: .2em;
  font-size: clamp(38px, 11vw, 58px); font-weight: 900; font-variant-numeric: tabular-nums;
}
.gleichung .teil, .gleichung .luecke, .gleichung .rest, .gleichung .ganz {
  /* jede Zahl in derselben Box (eine Ziffer breit plus Rand): überall gleiche Abstände, nichts springt */
  min-width: calc(1ch + .34em); padding: 0 .1em; border: .07em solid transparent; border-radius: .2em; text-align: center;
}
.gleichung .teil { color: var(--teil); }
.gleichung .rest { color: var(--rest); animation: pop .35s ease both; }
.gleichung .ganz { color: var(--ganz); }
.gleichung .luecke { border-style: dashed; border-color: var(--rest); color: var(--rest); }
.gleichung.weg { visibility: hidden; }          /* Platz bleibt, nichts springt */
.hinweis { margin: 0; min-height: 1.3em; text-align: center; font-size: clamp(18px, 5vw, 24px); font-weight: 800; }

.zahlen { display: grid; grid-template-columns: repeat(var(--spalten, 6), 1fr); gap: 8px; }
.zahl {
  height: clamp(54px, 14vw, 78px); border-radius: 16px; background: var(--karte);
  font-size: clamp(26px, 7.5vw, 40px); font-weight: 800; box-shadow: 0 4px 0 var(--sockel);
  transition: transform .08s ease, opacity .2s ease;
}
.zahl:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--sockel); }
.zahlen.ruht .zahl:not(.richtig) { opacity: .5; }
.zahl.richtig { background: var(--richtig); color: #fff; box-shadow: 0 4px 0 #1f8a3c; }
.zahl.wackelt { animation: wackeln .4s ease; }

@keyframes landen { 0% { transform: scale(1); } 45% { transform: scale(1.1); } 100% { transform: scale(1); } }
@keyframes wackeln {
  0%, 100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); }
  60% { transform: translateX(-6px); } 80% { transform: translateX(6px); }
}
@keyframes pop { 0% { transform: scale(.3); opacity: 0; } 70% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(1); } }
@keyframes hops { 0%, 100% { transform: none; } 40% { transform: scale(1.35); } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition: none !important; }
}

/* Update-Banner (Mechanik siehe Skill app-update-iphone) */
.update {
  position: fixed; left: 12px; right: 12px; top: max(env(safe-area-inset-top), 12px); z-index: 30;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  background: #34c759; color: #06240e;
  padding: 12px 14px; border-radius: 14px; font-weight: 600; box-shadow: 0 8px 24px rgba(0, 0, 0, .25);
  opacity: 0; transition: opacity .35s ease; pointer-events: none;
}
.update.an { opacity: 1; pointer-events: auto; }
.update[hidden] { display: none; }
.update.info { background: #2d2d33; color: #f2f2f7; font-weight: 500; }
.update.unten { top: auto; bottom: max(env(safe-area-inset-bottom), 12px); }
.update .btn { padding: 8px 14px; border-radius: 10px; font-size: 15px; font-weight: 700; background: #06240e; color: #fff; }
</style>
</head>
<body>
<div class="update" id="update" hidden>
  <span id="update-text"></span>
  <button class="btn" id="update-go">Jetzt laden</button>
</div>

<main class="seite" id="startseite">
  <header class="kopf">
    <h1>Würfel <span class="version" id="version"></span></h1>
    <div class="sterne" aria-label="Richtige Antworten"></div>
    <button class="ton" aria-label="Ton an oder aus"></button>
  </header>
  <section class="start">
    <h2>Welche Zahl zerlegen wir?</h2>
    <div class="zahlwahl" id="zahlwahl"></div>
    <p class="erklaerung">Der Würfel zeigt eine Zahl. Tippe die Zahl an, die bis zur gewählten Zahl fehlt.</p>
  </section>
</main>

<main class="seite" id="spielseite" hidden>
  <header class="kopf">
    <button class="zurueck" id="zurueck" aria-label="Andere Zahl wählen">‹</button>
    <h1 class="titel">Zerlegen: <span class="ganz" id="titel-n"></span> <span class="stand" id="stand"></span></h1>
    <div class="sterne" aria-label="Richtige Antworten"></div>
    <button class="ton" aria-label="Ton an oder aus"></button>
  </header>
  <section class="buehne">
    <div class="sockel">
      <button class="wuerfel" id="wuerfel" aria-label="Würfeln">
        <div class="koerper" id="koerper">
          <i class="kern"></i><i class="kern kx"></i><i class="kern ky"></i>
          <div class="flaeche vorne"><span id="augenzahl"></span></div>
          <div class="flaeche hinten"><span></span></div>
          <div class="flaeche rechts"><span></span></div>
          <div class="flaeche links"><span></span></div>
          <div class="flaeche oben"><span></span></div>
          <div class="flaeche unten"><span></span></div>
        </div>
      </button>
    </div>
    <p class="gleichung" id="gleichung" aria-live="polite"></p>
    <p class="hinweis" id="hinweis"></p>
  </section>
  <section class="zahlen ruht" id="zahlen" aria-label="Antwort antippen"></section>
</main>

<script>
const APP_VERSION = '0.4';          // bei JEDER Änderung hochzählen

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

/* ---------- Zustand ---------- */
const ZAHLEN = [4, 5, 6, 7, 8, 9, 10];
const SPEICHER = 'wuerfel.stand';
const stand = { n: 10, ton: true, sterne: 0 };
try {
  const s = JSON.parse(localStorage.getItem(SPEICHER)) || {};
  if (ZAHLEN.includes(s.n)) stand.n = s.n;
  if (s.ton === false) stand.ton = false;
  if (Number.isInteger(s.sterne) && s.sterne >= 0) stand.sterne = s.sterne;
} catch (_) {}
function speichereAlles() { try { localStorage.setItem(SPEICHER, JSON.stringify(stand)); } catch (_) {} }

const startEl = $('#startseite'), spielEl = $('#spielseite');
const wuerfelEl = $('#wuerfel'), koerperEl = $('#koerper'), gleichungEl = $('#gleichung');
const hinweisEl = $('#hinweis'), zahlenEl = $('#zahlen');
const ruhig = matchMedia('(prefers-reduced-motion: reduce)');
const LOB = ['Richtig!', 'Super!', 'Toll!', 'Prima!', 'Klasse!'];

let phase = 'start';                // 'start' | 'bereit' | 'rollt' | 'frage' | 'geloest'
let zahl = null;                    // gewürfelte Zahl
let beutel = [], geschafft = 0, weiterTimer = null;

/* ---------- Zufall ---------- */
// Gleichverteilt 0..m-1 – Verwerfungsmethode, damit kein Modulo-Überhang bleibt
function zufall(m) {
  const u = new Uint32Array(1), grenze = Math.floor(2 ** 32 / m) * m;
  do crypto.getRandomValues(u); while (u[0] >= grenze);
  return u[0] % m;
}
// Ziehen ohne Zurücklegen: jede Zerlegung 0+n … n+0 kommt pro Runde genau einmal.
// Gezogen wird von hinten; die erste Zahl einer Runde ist nie die letzte der vorigen.
function neuerBeutel(n, nicht) {
  const b = Array.from({ length: n + 1 }, (_, i) => i);
  for (let i = b.length - 1; i > 0; i--) { const j = zufall(i + 1); [b[i], b[j]] = [b[j], b[i]]; }
  if (b[b.length - 1] === nicht) [b[0], b[b.length - 1]] = [b[b.length - 1], b[0]];
  return b;
}

/* ---------- Ton ---------- */
// iOS spielt Web Audio sonst als „ambient“ – dann schluckt der Stummschalter alles.
try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (_) {}
let ctx = null;
function audio() {
  if (!stand.ton) return null;
  try {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
    }
    if (ctx.state !== 'running') ctx.resume();
  } catch (_) { return null; }
  return ctx;
}
function ton(freq, start, dauer, art = 'triangle', laut = 0.2) {
  const a = audio(); if (!a) return;
  const t = a.currentTime + start, o = a.createOscillator(), g = a.createGain();
  o.type = art;
  o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(laut, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dauer);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t + dauer + 0.05);
}
const klang = {
  tick() { ton(1250, 0, 0.035, 'triangle', 0.12); },                       // jeder Ziffernwechsel
  landen() { ton(330, 0, 0.12, 'sine', 0.25); },
  richtig() {                                                              // C-Dur aufwärts, dann Glitzern
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => ton(f, i * 0.09, 0.3));
    ton(1318.5, 0.36, 0.7, 'sine', 0.12);
    ton(1568, 0.36, 0.7, 'sine', 0.1);
  },
  falsch() {                                                               // „dö-döm“, tief und kurz
    ton(233.08, 0, 0.18, 'square', 0.07);
    ton(174.61, 0.17, 0.35, 'square', 0.07);
  },
  runde() {                                                                // alle Zerlegungen geschafft
    [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5, 1318.5].forEach((f, i) => ton(f, i * 0.12, i === 6 ? 0.9 : 0.3));
  },
};

/* ---------- Würfel: echter Würfel in 3D ---------- */
// In Ruhe liegt er leicht schräg (drei Seiten sichtbar), vorne die Zahl, die zerlegt wird.
// Beim Antippen wird die Zahl sofort ausgelost; dann überschlägt er sich 2 Sekunden lang immer
// langsamer. Jede Seite bekommt eine neue Zahl, während sie nach hinten zeigt – die Zahlen
// wechseln, ohne dass man das Umschreiben sieht. Die Vorderseite bekommt die ausgeloste Zahl bei
// ihrem letzten Verdecktsein (bis 73 % der Zeit) und rollt als Letzte nach vorn.
const ROLLZEIT = 2000;                                  // ms
const RUHE = { x: -20, y: -25 };                        // Grad
const DREH = { x: 1080, y: -360 };                      // drei Überschläge, eine Drehung seitwärts
const LICHT = [-0.25, -0.6, 0.76];                      // von links oben vorn
const NORMALE = { vorne: [0, 0, 1], hinten: [0, 0, -1], rechts: [1, 0, 0], links: [-1, 0, 0], oben: [0, -1, 0], unten: [0, 1, 0] };
const seiten = {};
for (const k in NORMALE) seiten[k] = { el: $('.flaeche.' + k), weg: false };
let lauf = null, rafId = 0;

function drehe([x, y, z], ax, ay) {                     // Normale nach rotateX(ax) rotateY(ay), wie im CSS
  const a = ax * Math.PI / 180, b = ay * Math.PI / 180;
  const x1 = x * Math.cos(b) + z * Math.sin(b), z1 = -x * Math.sin(b) + z * Math.cos(b);
  return [x1, y * Math.cos(a) - z1 * Math.sin(a), y * Math.sin(a) + z1 * Math.cos(a)];
}
function stelle(ax, ay) {
  koerperEl.style.transform = `rotateX(${ax}deg) rotateY(${ay}deg)`;
  for (const k in seiten) {
    const n = drehe(NORMALE[k], ax, ay);
    const hell = Math.max(0, n[0] * LICHT[0] + n[1] * LICHT[1] + n[2] * LICHT[2]);
    seiten[k].el.style.setProperty('--schatten', (0.2 * (1 - hell)).toFixed(3));
  }
}
function beschrifte(k, z) { seiten[k].el.firstElementChild.textContent = z; }
function zeigeZiffer(z) { beschrifte('vorne', z); }
// Zahl für eine Nebenseite: nie die gewürfelte, nie die Lösung (sonst verrät der Würfel die Antwort),
// und möglichst keine, die auf einer anderen Seite schon steht.
function zufallsZahl(k, seite) {
  const gesperrt = new Set([k, stand.n - k]);
  const frei = [];
  for (let z = 0; z <= stand.n; z++) if (!gesperrt.has(z)) frei.push(z);
  const belegt = new Set(Object.keys(seiten).filter(x => x !== seite).map(x => +seiten[x].el.textContent));
  const besser = frei.filter(z => !belegt.has(z));
  const auswahl = besser.length ? besser : frei;
  return auswahl[zufall(auswahl.length)];
}
function schritt(t) {
  const p = Math.min(1, (t - lauf.t0) / ROLLZEIT);
  const f = 1 - (1 - p) ** 2;                                       // gleichmäßig abbremsen
  const ax = RUHE.x + DREH.x * f, ay = RUHE.y + DREH.y * f;
  let vorn = null, best = -2;
  for (const k in seiten) {
    const s = seiten[k], z = drehe(NORMALE[k], ax, ay)[2];
    if (z > best) { best = z; vorn = k; }
    if (z < -0.1) {                                                 // zeigt nach hinten: umschreiben
      if (k === 'vorne' && p > 0.5) { if (!lauf.gesetzt) { beschrifte(k, lauf.ziel); lauf.gesetzt = true; } }
      else if (!s.weg) beschrifte(k, zufallsZahl(lauf.ziel, k));
      s.weg = true;
    } else if (z > 0) s.weg = false;
  }
  if (vorn !== lauf.vorn) { lauf.vorn = vorn; klang.tick(); }       // klickt bei jedem Überschlag
  if (!ruhig.matches) stelle(ax, ay);
  if (p >= 1) { landen(); return; }
  rafId = requestAnimationFrame(schritt);
}
function bereit(text = 'Tippe auf den Würfel!') {                 // zeigt die ganze Zahl und wartet
  clearTimeout(weiterTimer);
  phase = 'bereit';
  zahl = null;
  delete wuerfelEl.dataset.zahl;
  zeigeZiffer(stand.n);
  wuerfelEl.classList.remove('gelandet');
  wuerfelEl.classList.add('ganz');
  wuerfelEl.setAttribute('aria-label', 'Würfeln');
  zahlenEl.classList.add('ruht');
  zahlenEl.querySelectorAll('.richtig').forEach(b => b.classList.remove('richtig'));
  hinweisEl.textContent = text;
}
function wuerfeln() {
  clearTimeout(weiterTimer);
  if (!beutel.length) beutel = neuerBeutel(stand.n, null);
  lauf = { ziel: beutel.pop(), t0: performance.now(), gesetzt: false, vorn: 'vorne' };
  for (const k in seiten) seiten[k].weg = false;
  phase = 'rollt';
  zahl = null;
  audio();
  wuerfelEl.classList.remove('ganz', 'gelandet', 'landet');
  wuerfelEl.classList.add('rollt');
  wuerfelEl.setAttribute('aria-label', 'Würfelt …');
  document.body.classList.remove('gut', 'falsch');
  zahlenEl.classList.add('ruht');
  zahlenEl.querySelectorAll('.richtig').forEach(b => b.classList.remove('richtig'));
  gleichungEl.classList.add('weg');
  hinweisEl.textContent = '';
  zeigeStand();
  rafId = requestAnimationFrame(schritt);
}
function landen() {
  cancelAnimationFrame(rafId);
  zahl = lauf.ziel;
  zeigeZiffer(zahl);                                                // war schon da – nur zur Sicherheit
  stelle(RUHE.x, RUHE.y);
  wuerfelEl.classList.remove('rollt');
  wuerfelEl.classList.add('gelandet');
  wuerfelEl.dataset.zahl = zahl;
  wuerfelEl.setAttribute('aria-label', 'Gewürfelt: ' + zahl);
  nochmal(wuerfelEl, 'landet');
  klang.landen();
  phase = 'frage';
  zahlenEl.classList.remove('ruht');
  zeigeGleichung(zahl, null);
  gleichungEl.classList.remove('weg');
  hinweisEl.textContent = 'Welche Zahl fehlt?';
}
function stoppeWuerfel() {
  cancelAnimationFrame(rafId); clearTimeout(weiterTimer);
  wuerfelEl.classList.remove('rollt');
  stelle(RUHE.x, RUHE.y);
}

/* ---------- Anzeige ---------- */
function zeigeGleichung(k, rest) {
  const a = `<span class="teil">${k}</span>`;
  const b = rest == null ? '<span class="luecke">?</span>' : `<span class="rest">${rest}</span>`;
  gleichungEl.innerHTML = `${a}<span>+</span>${b}<span>=</span><span class="ganz">${stand.n}</span>`;
}
function zeigeSterne() { $$('.sterne').forEach(s => { s.textContent = '⭐ ' + stand.sterne; }); }
function zeigeTon() { $$('.ton').forEach(b => { b.textContent = stand.ton ? '🔊' : '🔇'; }); }
function zeigeStand() { $('#stand').textContent = geschafft + '/' + (stand.n + 1); }
function nochmal(el, klasse) { el.classList.remove(klasse); void el.offsetWidth; el.classList.add(klasse); }
let farbTimer = null;
function faerbe(klasse, ms) {
  clearTimeout(farbTimer);
  document.body.classList.remove('gut', 'falsch');
  void document.body.offsetWidth;
  document.body.classList.add(klasse);
  farbTimer = setTimeout(() => document.body.classList.remove(klasse), ms);
}

function baueZahlen() {
  zahlenEl.textContent = '';
  const anzahl = stand.n + 1;
  zahlenEl.style.setProperty('--spalten', anzahl <= 6 ? anzahl : Math.ceil(anzahl / 2));
  for (let k = 0; k <= stand.n; k++) {
    const b = document.createElement('button');
    b.className = 'zahl';
    b.dataset.zahl = k;
    b.textContent = k;
    zahlenEl.append(b);
  }
}

/* ---------- Ablauf ---------- */
function zeigeStart() {
  stoppeWuerfel();
  phase = 'start';
  document.body.classList.remove('gut', 'falsch');
  $$('#zahlwahl button').forEach(b => b.classList.toggle('zuletzt', +b.dataset.n === stand.n));
  spielEl.hidden = true;
  startEl.hidden = false;
}
function starteSpiel(n) {
  stand.n = n;
  speichereAlles();
  audio();                                       // iOS: Ton im Rahmen eines Tipps freischalten
  $('#titel-n').textContent = n;
  baueZahlen();
  beutel = neuerBeutel(n, null);
  geschafft = 0;
  zeigeStand();
  startEl.hidden = true;
  spielEl.hidden = false;
  zeigeGleichung(0, null);                        // unsichtbar, hält aber ihren Platz – nichts springt
  for (const k in seiten) if (k !== 'vorne') beschrifte(k, zufallsZahl(n, k));
  gleichungEl.classList.add('weg');               // vor der ersten Aufgabe keine Gleichung
  bereit();
}

function tippeWuerfel() {
  if (phase === 'bereit' || phase === 'geloest') wuerfeln();
  else if (phase === 'frage') { nochmal(wuerfelEl, 'stups'); hinweisEl.textContent = 'Tippe unten die Zahl an!'; }
}

function antwort(k, btn) {
  if (phase !== 'frage') { if (phase === 'bereit') nochmal(wuerfelEl, 'stups'); return; }
  if (k !== stand.n - zahl) {
    faerbe('falsch', 900);
    klang.falsch();
    nochmal(btn, 'wackelt');
    hinweisEl.textContent = 'Probier es nochmal!';
    return;
  }
  phase = 'geloest';
  stand.sterne++;
  speichereAlles();
  zeigeSterne();
  $$('.sterne').forEach(s => nochmal(s, 'hops'));
  geschafft++;
  zeigeStand();
  btn.classList.add('richtig');
  zahlenEl.classList.add('ruht');
  zeigeGleichung(zahl, k);
  const rundeFertig = !beutel.length;
  faerbe('gut', rundeFertig ? 2600 : 1600);
  if (rundeFertig) {
    klang.runde();
    hinweisEl.textContent = 'Alle Zerlegungen der ' + stand.n + ' geschafft!';
    beutel = neuerBeutel(stand.n, zahl);
    geschafft = 0;
  } else {
    klang.richtig();
    hinweisEl.textContent = LOB[zufall(LOB.length)];
  }
  // Danach zeigt der Würfel wieder die ganze Zahl; die gelöste Gleichung bleibt zum Einprägen stehen.
  weiterTimer = setTimeout(() => {
    if (phase === 'geloest') bereit(rundeFertig ? 'Neue Runde: Tippe auf den Würfel!' : undefined);
  }, rundeFertig ? 3000 : 1800);
}

/* ---------- Verdrahtung ---------- */
for (const n of ZAHLEN) {
  const b = document.createElement('button');
  b.dataset.n = n;
  b.textContent = n;
  b.addEventListener('click', () => starteSpiel(n));
  $('#zahlwahl').append(b);
}
wuerfelEl.addEventListener('click', tippeWuerfel);
zahlenEl.addEventListener('click', e => { const b = e.target.closest('.zahl'); if (b) antwort(+b.dataset.zahl, b); });
$('#zurueck').addEventListener('click', zeigeStart);
$$('.ton').forEach(b => b.addEventListener('click', () => {
  stand.ton = !stand.ton; speichereAlles(); zeigeTon();
  if (stand.ton) ton(783.99, 0, 0.15);
}));

$('#version').textContent = 'v' + APP_VERSION;
stelle(RUHE.x, RUHE.y);
zeigeSterne();
zeigeTon();
zeigeStart();

/* ---------- Updates (Bausteine 0–4, Skill app-update-iphone) ---------- */
const updateEl = $('#update');
let infoTimer = null, ausTimer = null;
function einblenden() {
  clearTimeout(ausTimer);
  updateEl.hidden = false; void updateEl.offsetWidth;
  updateEl.classList.add('an');
}
function ausblenden() {
  updateEl.classList.remove('an'); clearTimeout(ausTimer);
  ausTimer = setTimeout(() => { if (!updateEl.classList.contains('an')) updateEl.hidden = true; }, 380);
}
function bannerAnKante(ausloeser) {
  if (!ausloeser) { updateEl.classList.remove('unten'); return; }
  const r = ausloeser.getBoundingClientRect();
  updateEl.classList.toggle('unten', r.top + r.height / 2 > window.innerHeight / 2);
}
function showInfo(text, sekunden = 2, ausloeser = null) {
  bannerAnKante(ausloeser);
  updateEl.className = 'update info';
  $('#update-text').textContent = text;
  $('#update-go').hidden = true;
  einblenden();
  clearTimeout(infoTimer);
  if (sekunden) infoTimer = setTimeout(() => { if (updateEl.classList.contains('info')) ausblenden(); }, sekunden * 1000);
}
function zeigeBanner(text) {
  bannerAnKante(null);
  updateEl.className = 'update';
  $('#update-text').textContent = text;
  $('#update-go').hidden = false;
  einblenden();
}
updateEl.addEventListener('click', () => { if (updateEl.classList.contains('info')) ausblenden(); });
$('#update-go').addEventListener('click', () => { speichereAlles(); location.reload(); });

let checking = false, announced = null;
async function checkForUpdate(manual = false) {
  if (checking) return;
  if (!manual && document.visibilityState !== 'visible') return;
  const ausloeser = manual ? $('#version') : null;
  if (!navigator.onLine) { if (manual) showInfo('Offline – Prüfung nicht möglich', 2, ausloeser); return; }
  checking = true;
  try {
    const res = await fetch('index.html', { cache: 'no-store' });
    if (!res.ok) return;
    const m = (await res.text()).match(/APP_VERSION = '([^']+)'/);
    if (m && m[1] !== APP_VERSION) announceUpdate(m[1], manual);
    else if (manual) showInfo('Version ' + APP_VERSION + ' ist aktuell', 4, ausloeser);
  } catch (_) { if (manual) showInfo('Prüfung fehlgeschlagen', 2, ausloeser); }
  finally { checking = false; }
}
function announceUpdate(v, manual) {
  if (announced === v && !manual) return;
  announced = v;
  speichereAlles();
  zeigeBanner('Neue Version ' + v + ' ist da');
  setTimeout(() => location.reload(), manual ? 1500 : 3000);   // kein Textfeld – Neuladen stört nichts
}
window.addEventListener('pageshow', () => setTimeout(checkForUpdate, 800));
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkForUpdate(); });
$('#version').addEventListener('click', () => checkForUpdate(true));

{
  const GESEHEN = 'wuerfel.gesehen';
  let vorher = null;
  try { vorher = localStorage.getItem(GESEHEN); } catch (_) {}
  if (vorher !== APP_VERSION) {
    try { localStorage.setItem(GESEHEN, APP_VERSION); } catch (_) {}
    if (vorher) setTimeout(() => showInfo('Version ' + APP_VERSION + ' ist geladen', 4), 400);
  }
}

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

// Für die Tests in tests/spiel.mjs
window.wuerfelSpiel = {
  zufall, neuerBeutel, stand, starteSpiel,
  get zahl() { return zahl; }, get phase() { return phase; }, get beutel() { return beutel.slice(); },
  get seiten() { return Object.fromEntries(Object.keys(seiten).map(k => [k, seiten[k].el.textContent])); },
};
